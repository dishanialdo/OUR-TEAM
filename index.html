<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Our Team</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="wrap">
        <h1>Meet Our Team</h1>
        <p class="intro">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quod.</p>
        <section id="team" aria-label="Team"></section>

        <section class="add" aria-label="Aggiungi un membro">
            <h2>Aggiungi un membro del team</h2>
            <form id="form-membro">
                <input type="text" id="nome" name="nome" placeholder="Nome e cognome" required>
                <input type="text" id="ruolo" name="ruolo" placeholder="Ruolo" required>
                <input type="email" id="email" name="email" placeholder="Email" required>
                <label class="file">
                    <span id="file-label">Foto (facoltativa)</span>
                    <input type="file" id="foto" name="foto" accept="image/*">
                </label>
                <button type="submit">Aggiungi</button>
            </form>
        </section>
    </main>

    <script src="main.js"></script>
</body>

</html>
